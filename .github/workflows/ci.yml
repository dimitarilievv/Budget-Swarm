name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: budgetswarm
          POSTGRES_PASSWORD: budgetswarm
          POSTGRES_DB: budgetswarm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budgetswarm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://budgetswarm:budgetswarm@localhost:5432/budgetswarm_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .
        working-directory: .

      - name: Black (format check)
        run: black --check .
        working-directory: .

      - name: Alembic — apply baseline migration on fresh DB
        run: alembic upgrade head

      - name: Alembic — verify downgrade is reversible
        run: alembic downgrade base

      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier (format check)
        run: npm run format:check

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build
