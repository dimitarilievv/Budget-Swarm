# nginx config for the production frontend image (BS-103).
# Serves the static Vite bundle and supports client-side (SPA) routing.
#
# The API (/api/*) is NOT served here — in production it is routed to the backend
# by the external reverse proxy / ingress, exactly as Caddy does in local dev.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fingerprinted build assets can be cached aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: unknown paths return index.html so the client router handles them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
