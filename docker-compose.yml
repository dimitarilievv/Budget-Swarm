services:
  db:
    image: postgres:16-alpine
    container_name: budgetswarm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - budgetswarm

  backend:
    build:
      context: ./backend
      # Dev uses the hot-reload stage; the production stage is built for deploys
      # (docker build --target production ./backend).
      target: development
    container_name: budgetswarm-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Auth (BS-110): JWT_SECRET is REQUIRED — compose fails fast with a clear message if
      # it isn't set in .env (see .env.example). The rest have sane defaults.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env — see .env.example}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      AUTH_RATE_LIMIT_REQUESTS: ${AUTH_RATE_LIMIT_REQUESTS:-5}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      # Allowed browser origins. Includes the HTTPS proxy origin (https://localhost) so the
      # app works both through Caddy and when hitting the Vite dev server directly.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://localhost,https://127.0.0.1}
      # /app is the working dir; ai_engine is mounted under it so `import ai_engine`
      # resolves in the backend container (BS-081).
      PYTHONPATH: /app
      # Turn on the real decision engine (needs a seeded reference DB + the keys below).
      ENABLE_REAL_ENGINE: ${ENABLE_REAL_ENGINE:-false}
      # Optional provider keys — each provider has a keyless fallback, so these only
      # upgrade estimated data to live data (BS-081).
      ORS_API_KEY: ${ORS_API_KEY:-}
      TRAVELPAYOUTS_TOKEN: ${TRAVELPAYOUTS_TOKEN:-}
      OPENTRIPMAP_API_KEY: ${OPENTRIPMAP_API_KEY:-}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      PUBLIC_TRANSPORT_API_KEY: ${PUBLIC_TRANSPORT_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Mount the engine + its reference data into the backend container so the real
      # pipeline is importable and can read the ingested datasets (BS-081).
      - ./ai_engine:/app/ai_engine
      - ./data:/app/data
      # Also mount data at /data so the ingestion/seed scripts resolve it when run
      # in-container (BS-104): they anchor data at <repo-root>/data, which is /data
      # here because backend is mounted at /app (its parent is /).
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Hit the real health route (/api/health). It returns 200 once the API is
      # up, so this is a liveness check independent of DB state.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - budgetswarm
    # Weekly fuel-price refresh (BS-032), driven by the ofelia scheduler below.
    # job-exec runs the ingest inside this already-running backend container, so
    # it reuses its code, deps, and DATABASE_URL. Schedule is 6-field cron
    # (sec min hour dom mon dow): Fridays 06:00 UTC — safely after the EU Oil
    # Bulletin's Thursday (post-15:00 EET) update. The ingest is idempotent, so a
    # missed or repeated run only refreshes rows in place.
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.fuel-refresh.schedule: "0 0 6 * * 5"
      ofelia.job-exec.fuel-refresh.command: "python -m scripts.ingest_fuel_prices"
      # Daily auth housekeeping: delete expired/revoked refresh tokens so the
      # table doesn't grow without bound. 6-field cron: every day 03:30 UTC.
      # Idempotent — a run with nothing to purge is a no-op.
      ofelia.job-exec.refresh-token-purge.schedule: "0 30 3 * * *"
      ofelia.job-exec.refresh-token-purge.command: "python -m scripts.purge_refresh_tokens"
      # Weekly Inside Airbnb snapshot refresh (BS-refresh): checks the index for newer
      # snapshots of the 11 covered cities and re-imports only those that changed —
      # atomic per city, never deletes valid data on failure, never touches the
      # wherenext-cost-model estimates. 6-field cron (sec min hour dom mon dow);
      # default Mondays 04:00 UTC. Override with ACCOMMODATION_REFRESH_SCHEDULE in .env.
      # Run on demand: docker compose exec backend python -m scripts.refresh_accommodations
      ofelia.job-exec.accommodation-refresh.schedule: "${ACCOMMODATION_REFRESH_SCHEDULE:-0 0 4 * * 1}"
      ofelia.job-exec.accommodation-refresh.command: "python -m scripts.refresh_accommodations"
      # Weekly Inside Airbnb CALENDAR refresh (BS-calendar) for the 11 covered cities.
      # DISABLED by default: the command no-ops unless ACCOMMODATION_CALENDAR_REFRESH_ENABLED
      # is true (checked via --scheduled). Bounded + per-city isolated + atomic
      # validate-before-replace (a failed city keeps its previous snapshot). Inside Airbnb
      # publishes roughly monthly/quarterly, so a weekly check mostly skips unchanged snapshots.
      # 6-field cron; default Mondays 04:30 UTC (after the listings refresh). Separate from it
      # so calendar imports never run as a side effect of the listings/stats job.
      ofelia.job-exec.calendar-refresh.schedule: "${ACCOMMODATION_CALENDAR_REFRESH_SCHEDULE:-0 30 4 * * 1}"
      ofelia.job-exec.calendar-refresh.command: "python -m scripts.refresh_calendars --all --scheduled"

  scheduler:
    # Lightweight cron for Docker: reads the ofelia.* labels off other services
    # and runs their commands on schedule. No app image changes, no host crontab.
    image: mcuadros/ofelia:latest
    container_name: budgetswarm-scheduler
    restart: unless-stopped
    depends_on:
      - backend
    command: daemon --docker
    volumes:
      # Read-only access to the Docker socket so ofelia can exec into backend.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - budgetswarm

  frontend:
    build:
      context: ./frontend
      # Dev uses the Vite hot-reload stage; the production stage builds the static
      # bundle served by nginx (docker build --target production ./frontend).
      target: development
    container_name: budgetswarm-frontend
    restart: unless-stopped
    environment:
      # Call the API through the HTTPS proxy — same origin as the app served at
      # https://localhost (set to http://localhost:8000 to bypass the proxy).
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://localhost}
      # Vite's HMR websocket reaches the dev server through Caddy on 443.
      VITE_HMR_CLIENT_PORT: "443"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    healthcheck:
      # Vite dev server serves the app shell at / once it is ready. busybox wget
      # ships in the node:alpine image. Use 127.0.0.1 (not localhost): the image's
      # /etc/hosts resolves localhost to ::1 first, but Vite listens on IPv4, and
      # busybox wget does not fall back across addresses.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - budgetswarm

  proxy:
    # Reverse proxy terminating TLS at https://localhost (Caddy's internal CA).
    # Routes /api/* -> backend and everything else -> the Vite frontend.
    image: caddy:2
    container_name: budgetswarm-proxy
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - budgetswarm

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  budgetswarm:
    driver: bridge
