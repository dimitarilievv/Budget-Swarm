# Python code-quality config (BS-017) — covers backend/ and ai_engine/.
# ruff = linting, black = formatting. Run from the repo root.

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/__pycache__", ".venv", "venv"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear.
select = ["E", "W", "F", "I", "UP", "B"]
# Black owns line length; don't double-report long lines.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests may re-import/shadow freely; placeholders may keep unused stubs.
"**/tests/**" = ["F811", "F401"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are meant to be called in argument
# defaults (Depends(...), Query(...)) — treat them as immutable so B008 doesn't
# flag the idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
# The backend test job runs pytest from backend/, but some suites now exercise
# ai_engine too (e.g. the provider abstractions in ai_engine/utils). Put both the
# repo root (for `ai_engine`) and backend/ (for `db`, `config`, …) on sys.path so
# imports resolve regardless of the invocation directory.
pythonpath = [".", "backend"]
markers = [
    "integration: tests that require a live database (skipped when none is reachable)",
]

# --- Coverage (BS Phase 11) --------------------------------------------------
# Measures the app code (ai_engine + backend packages); mechanical/generated files
# and the tests themselves are excluded so the number reflects real logic coverage.
[tool.coverage.run]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "backend/alembic/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
